# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit enforces the rules defined in CLAUDE.md
# This config tells CodeRabbit HOW to enforce those rules during PR reviews

language: en-US

tone_instructions: "Be direct and concise. Flag violations clearly with rule references."

reviews:
  auto_review:
    enabled: true
  request_changes_workflow: true  # Block merge if violations found
  high_level_summary: true

  path_instructions:
    - path: "src/**/*.rs"
      instructions: |
        Be direct and zero-tolerance for sloppiness. This is application code.

        MUST flag these violations (per CLAUDE.md):

        TYPE SAFETY:
        - `unsafe` blocks (forbidden outright by the crate lints)
        - `as` casts — require TryFrom/From so the conversion is lossless or fails
        - `#[allow(...)]`, `#[cfg_attr(..., allow(...))]`, or any other lint silencing
        - Stringly-typed data where a newtype or enum carries the invariant
        - Public items without `///` docs or without an explicit return type

        FUNCTION DESIGN:
        - Functions over 50 lines, files over 300 lines
        - More than 3 positional parameters (receiver excluded) — take a struct
        - Generic module names (`utils.rs`, `helpers.rs`) — name for the responsibility

        ERROR HANDLING:
        - `unwrap()`, `expect()`, `panic!`, `todo!`, `unimplemented!` outside `#[cfg(test)]`
        - Absorbing an error (`ok()`, `unwrap_or_default()`, a swallowing `match`) outside
          a file listed in ERROR_BOUNDARIES in `scripts/gates.conf`
        - Fallback values that mask a failure instead of letting the error propagate
        - New error variants that drop the source error instead of `#[source]`/`#[from]`
        - `Result` returned from a public fn with no `# Errors` doc section

        TRUST BOUNDARIES:
        - Re-validating data whose type already guarantees the invariant
        - Validating internal interfaces — validate external input at the boundary
          (serde/deserialization), then trust it

        ARCHITECTURE:
        - Branching on test state in production code (`cfg!(test)`, test-only flags)
        - Mocking in-process collaborators instead of exercising them
        - Adding a strategy or runner by any route other than implementing its trait
          and registering it (see `src/strategies/signature/` for the reference shape)
        - Unnecessary abstractions without clear benefit
        - Not following existing codebase patterns
        - Stateful design where stateless would work

        `#[cfg(test)]` MODULES (unit tests live inline in the file they cover):
        Verify they validate BEHAVIOR, not just coverage.
        - Tests that only assert "it did not panic" - REJECT
        - Tests that don't assert meaningful outcomes - REJECT
        - Tests sharing mutable state (statics, `OnceLock`, env vars) across tests - REJECT
        - Tests that only execute code without validating behavior - REJECT
        - Each test must be independent and order-agnostic
        - `unwrap`/`expect` are fine here — a panic IS the failure signal

    - path: "tests/**/*.rs"
      instructions: |
        Integration tests exercise the crate through its public API.

        TEST QUALITY (per CLAUDE.md):
        - Same behavior-over-coverage bar as the unit tests
        - Reaching for crate internals instead of the public API - REJECT
        - Shared state or ordering assumptions between test functions - REJECT

    - path: "infra/**/*.ts"
      instructions: |
        This is CDK infrastructure code. Verify:

        INFRASTRUCTURE RULES (per CLAUDE.md):
        - L2/L3 constructs used (L1/Cfn* requires justification comment)
        - No hardcoded ARNs, account IDs, or secrets
        - All config comes from CDK context, SSM, or Secrets Manager
        - Stacks are small and focused (one bounded context)
        - Stacks are environment-agnostic

        CONFIGURATION:
        - No hardcoded values - everything externalized
        - Secrets ONLY in AWS Secrets Manager or GitHub Secrets
        - Config values from proper hierarchy (see docs/guides/SECRETS_MANAGEMENT.md)

    - path: "Dockerfile*"
      instructions: |
        This image is what runs on ECS Fargate. Verify:

        - Multi-stage build; the runtime stage carries no toolchain or build cache
        - Base images pinned to a digest or an explicit version, never `latest`
        - Runs as a non-root user
        - No secrets in ARG/ENV or baked into a layer — inject at task-definition time

    - path: ".github/workflows/**"
      instructions: |
        Workflows hold deployment credentials. Verify:

        - Third-party actions pinned to a commit SHA, not a moving tag
        - `permissions:` declared and scoped to the minimum the job needs
        - AWS access via OIDC role assumption, never long-lived access keys
        - No secret echoed into logs, an output, or a PR comment
        - Untrusted PR input never interpolated into a `run:` block

    - path: "**/*.md"
      instructions: |
        Documentation must be accurate and match the implementation.
        Do not enforce engineering standards on markdown files.

    - path: "openspec/specs/**"
      instructions: |
        These specs are vendored from SC0RED/sc0red-standards by `make sync-standards`.
        Flag any hand edit — the change belongs upstream in sc0red-standards.

knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto
