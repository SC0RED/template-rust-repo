# Parameters for the catalog gates in scripts/check_*.sh.
#
# The spec catalog states the invariant; this file sets the value for this repo.
# Every gate that needs a threshold or an allowlist reads it from here, so the
# specs stay language-independent and the tuning stays local.

# check_error_boundaries.sh — files permitted to absorb an error instead of
# propagating it. These are the declared boundaries: process entry points and
# the top-level orchestrators that must not crash the daemon.
# src/logging/mod.rs reads LOG_LEVEL/SERVICE_NAME from the environment at
# startup. Absent-and-defaulted is the correct reading of a missing optional
# env var — that is external input at a boundary, not an internal invariant
# being papered over.
ERROR_BOUNDARIES="src/main.rs src/logging/mod.rs"

# check_blast_radius.sh — how many top-level modules under src/ one change may
# touch before the seam is suspect. Raise only with a reason.
MAX_MODULES_PER_CHANGE=2

# check_blast_radius.sh — branch a feature branch is measured against.
BLAST_RADIUS_BASE="origin/development"

# check_mocking.sh — traits that may be mocked. Only process-external
# dependencies belong here: network clients, clocks, filesystems. Mocking an
# in-process collaborator couples the test to the shape of the code.
MOCKABLE_TRAITS=""

# check_failure_coverage.sh — minimum line coverage for files that declare an
# error boundary or a typed error. These are the paths where an untested branch
# costs the most, so they carry a higher bar than the repo-wide gate.
FAILURE_PATH_COVERAGE_MIN=90

# check_failure_coverage.sh — paths the coverage gate does not measure. The
# binary entry point is wiring only; all substantive logic lives in the library
# crate, so covering it measures nothing. Keep this in step with any
# --ignore-filename-regex passed to cargo llvm-cov in `make test`.
COVERAGE_EXCLUDED_PATHS="src/main.rs"

# check_module_orientation.sh — a module directory with more than this many
# source files must carry a README. Below it, the file names are the orientation.
MODULE_README_TRIGGER=3

# check_agent_instructions.sh — line budget for the agent instruction file.
# Past this, readers skim, and the parts that only exist as instruction stop landing.
AGENT_INSTRUCTIONS_MAX_LINES=60

# check_file_size.sh — budgets. Files split at a responsibility boundary, not a line count.
MAX_FILE_LINES=300
MAX_FUNCTION_LINES=50
