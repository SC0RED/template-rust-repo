name: Update AWS Secrets Manager

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to update secrets for'
        required: true
        type: string
      region:
        description: 'AWS region override (optional)'
        required: false
        type: string

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to update secrets for'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - testing
          - demo
          - production
      region:
        description: 'AWS region override (optional)'
        required: false

jobs:
  update-secrets:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      ENVIRONMENT: ${{ inputs.environment || github.event.inputs.environment }}
      REGION_OVERRIDE: ${{ inputs.region || github.event.inputs.region }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Map environment name
        id: env-map
        run: echo "upper=$(echo '${{ env.ENVIRONMENT }}' | tr '[:lower:]' '[:upper:]')" >> $GITHUB_OUTPUT

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          AWS_ACCOUNT_ID: op://Engineering/AWS_ACCOUNT_ID_${{ steps.env-map.outputs.upper }}/credential
          AWS_REGION: op://Engineering/AWS_REGION_${{ steps.env-map.outputs.upper }}/credential
          AWS_ACCESS_KEY_ID: op://Engineering/AWS_ACCESS_KEY_ID_${{ steps.env-map.outputs.upper }}/credential
          AWS_SECRET_ACCESS_KEY: op://Engineering/AWS_SECRET_ACCESS_KEY_${{ steps.env-map.outputs.upper }}/credential
          SLACK_WEBHOOK_URL: op://Engineering/SLACK_WEBHOOK_URL/credential

      - name: Apply region override
        if: env.REGION_OVERRIDE != ''
        run: echo "AWS_REGION=${REGION_OVERRIDE}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update AWS Secrets Manager
        run: |
          set -euo pipefail

          SECRET_NAME="sc0red-${ENVIRONMENT}"
          echo "Updating secret: $SECRET_NAME"

          # Build JSON with all configuration values
          SECRET_JSON=$(cat <<EOF
          {
            "environment": "${ENVIRONMENT}",
            "aws_region": "${AWS_REGION}",
            "aws_account_id": "${AWS_ACCOUNT_ID}",
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "deployed_by": "github-actions",
            "commit_sha": "${{ github.sha }}",
            "branch": "${ENVIRONMENT}",
            "repository": "${{ github.repository }}",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_number": "${{ github.run_number }}"
          }
          EOF
          )

          # Update the secret
          aws secretsmanager update-secret --secret-id "$SECRET_NAME" --secret-string "$SECRET_JSON"

          # Tag for clarity
          aws secretsmanager tag-resource \
            --secret-id "$SECRET_NAME" \
            --tags "[{\"Key\":\"Environment\",\"Value\":\"${ENVIRONMENT}\"},{\"Key\":\"Project\",\"Value\":\"Sc0red\"},{\"Key\":\"ManagedBy\",\"Value\":\"github-actions\"}]"

          echo "✅ Finished updating AWS Secrets Manager."

      - name: Notify Slack
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          STATUS_EMOJI="${{ job.status == 'success' && '✅' || '❌' }}"
          STATUS_TEXT="${{ job.status == 'success' && 'succeeded' || 'failed' }}"

          curl -X POST $SLACK_WEBHOOK_URL \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"${STATUS_EMOJI} Secrets update ${STATUS_TEXT}\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*${STATUS_EMOJI} Secrets update ${STATUS_TEXT} for ${ENVIRONMENT}*\"
                  }
                },
                {
                  \"type\": \"section\",
                  \"fields\": [
                    {
                      \"type\": \"mrkdwn\",
                      \"text\": \"*Environment:*\\n${ENVIRONMENT}\"
                    },
                    {
                      \"type\": \"mrkdwn\",
                      \"text\": \"*Run:*\\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>\"
                    }
                  ]
                }
              ]
            }"
