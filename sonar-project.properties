sonar.projectKey=Sc0red_template-rust-repo
sonar.organization=sc0red
sonar.projectName=Sc0red Rust Template
sonar.sources=src
# Rust unit tests live inline in src files (#[cfg(test)] modules).
# Coverage is imported from the lcov report produced by `make test`.
sonar.rust.lcov.reportPaths=lcov.info
sonar.exclusions=target/**

# Block on the quality gate rather than uploading and moving on. Without this
# the scanner reports and exits 0, so every Sonar rule is a dashboard entry
# nobody has to act on. With it, a failing gate fails the build.
sonar.qualitygate.wait=true
